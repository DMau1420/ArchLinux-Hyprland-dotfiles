# Variables Locales
$font_family = JetBrains Mono Nerd Font Mono ExtraBold
$font2 = AnonymicePro Nerd Font Mono Bold Italic
$wall =  /tmp/wallpaper_actual

$album_art = /tmp/album.png
$art_file = /tmp/mpris_blur.png

source= $HOME/.config/hypr/hyprlock/scripts.conf
source = $HOME/.config/hypr/hyprlock/colors.conf


# GENERAL
general {
    no_fade_in = false
    grace = 1
    disable_loading_bar = false
    ignore_empty_input = true
    text_trim = true
}

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 2
    blur_size = 4
    reload_time = 0
    crossfade_time = 0.5
}

# Hora
label {
    monitor =
    text = $TIME
    color = $fg_color
    font_size = 90
    font_family = AnonymicePro Nerd Font Mono Bold Italic
    position = 0, -50
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgb(80, 80, 80)
}

# Fecha
label {
    monitor =
    text = cmd[update:1000] date +"%A %d %b"
    color = $fg_color 
    font_size = 20
    font_family = $font_family
    position = 0, -165
    halign = center
    valign = top    
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgb(80, 80, 80)
}

# Clima
label {
    monitor = 
    text = cmd[update:1000] $clima
    color = $fg_color
    font_size = 12
    font_family = $font2
    position = -50, -18
    halign = right
    valign = top
    zindex = 5    
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgb(80, 80, 80)
}


# USER AVATAR
image {
    monitor =
    path = /usr/share/sddm/faces/maulinux.face.icon
    size = 170
    border_size = 4
    border_color = $bg_color
    position = 0, 150
    halign = center
    valign = center
}

# Music background
shape {
    monitor = 
    size = 430, 110
    color = $bg_color
    rounding = 20
    position = 0, -250
    halign = center
    valign = center
    zindex = 1
}

# Album art
image {
    monitor = 
    path = $album_art
    size = 80
    rounding = 12
    position = -160, -250
    halign = center
    valign = center
    zindex = 5
    reload_time = 0
}

# Player Source
label {
    monitor = 
    text = cmd[update:1000] echo "$($music --source)"
    color = rgba(64, 120, 213, 1)
    font_size = 13
    font_family = $font_family
    position = 860, -215
    halign = left
    valign = center
    zindex = 5
}

# Player Title
label {
    monitor = 
    text = cmd[update:1000] echo "$($music --title)"
    color = $fg_color
    font_size = 12
    font_family = $font_family
    position = 860, -245
    halign = left
    valign = center
    zindex = 5
}

#Player Artist
label {
    monitor = 
    text = cmd[update:1000] echo "$($music --artist)"
    color = $fg_color
    font_size = 11
    font_family = $font_family
    position = 860, -265
    halign = left
    valign = center
    zindex = 5
}

# Player Status
label {
    monitor = 
    text = cmd[update:1000] echo "$($music --status)"
    color = $fg_color
    font_size = 14
    font_family = $font_family
    position = -760, -245
    halign = right
    valign = center
    zindex = 5
}

# Progress bar
label {
    monitor = 
    text = cmd[update:1000] echo "$($player_bar)"
    color = $fg_color
    font_size = 11
    font_family = $font_family
    position = -760, -285
    halign = right
    valign = center
    zindex = 5
}

$LAST_PLAYER="$(playerctl -l | tail -n1)"
# Next button
label {
    monitor =
    text = cmd[update:100] { playerctl status -p $LAST_PLAYER | grep -q "Playing" ;} && echo "󰒭"
    onclick = playerctl -p $LAST_PLAYER next && $HOME/.config/hypr/hyprlock/scripts/album.sh
    font_size = 12
    font_family = $fontFamily Bold
    position = 900, -285
    halign = left
    valign = center
    zindex = 5
}

# Prev button
label {
    monitor =
    text = cmd[update:100] { playerctl status -p $LAST_PLAYER | grep -q "Playing" ;} && echo "󰒮"
    onclick = playerctl -p $LAST_PLAYER previous && $HOME/.config/hypr/hyprlock/scripts/album.sh
    font_size = 12
    font_family = $fontFamily Bold
    position = 860, -285
    halign = left
    valign = center
    zindex = 5
}

# Play/Pause button
label {
    monitor =
    text = cmd[update:100] player=$LAST_PLAYER; [ -z "$player" ] && echo "" || (playerctl status -p "$player" 2>/dev/null | grep -q '^Playing$' && echo "⏸" || echo "▶")
    onclick = playerctl -p $LAST_PLAYER play-pause
    font_size = 12
    font_family = $fontFamily Bold
    position = 880, -285
    halign = left
    valign = center
    zindex = 5
}

# Distribucion de Teclado 
label {
    monitor =
    text = cmd[update:100] hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap'
    color = $fg_color
    font_size = 12
    font_family = AnonymicePro Nerd Font Mono Bold Italic
    position = 50, 20
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgb(80, 80, 80)
}

# Input Field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 1
    outer_color = $border_color
    dots_size = 0.1
    dots_spacing = 1
    dots_center = true
    inner_color = $in_color
    font_color = $fg_color
    fade_on_empty = true
    placeholder_text = <i></i>
    hide_input = false
    position = 0, 50
    halign = center
    valign = bottom
}

# Bateria background
shape {
    monitor = 
    size = 70, 35
    color = $bg_color
    rounding = 10
    position = -40, 10
    halign = right
    valign = bottom
    zindex = 1
}

# Bateria
label {
    monitor = 
    text = cmd[update:1000] echo -e "$($battery)"
    color = $fg_color
    font_size = 12
    font_family = AnonymicePro Nerd Font Mono Bold Italic
    position = -50, 20
    halign = right
    valign = bottom
    zindex = 5
}

