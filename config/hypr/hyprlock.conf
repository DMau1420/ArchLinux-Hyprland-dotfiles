# Variables Locales
$fontFamily = JetBrainsMono Nerd Font
$text_color = rgba(242, 243, 244, 0.75)

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# BACKGROUND
background {
    monitor =
    path = /tmp/wallpaper_actual 
    blur_passes = 2
    blur_size = 4
}

# TIME
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 90
    font_family = ArcadeClassic
    position = -30, 0
    halign = right
    valign = top
}

label {
  monitor =
  text = cmd[update:43200000] date +"%a, %d - %b - %Y"
  color = $text_color 
  font_size = 20
  font_family = ArcadeClassic
  position = -30, -125
  halign = right
  valign = top
}

# USER AVATAR
image {
    monitor =
    path = /usr/share/sddm/faces/maulinux.face.icon
    size = 150
    border_size = 4
    border_color = $text_color
    position = 0, 150
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(64, 134, 213, 1.0)
    inner_color = rgba(30, 30, 46, 0.5)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <i>Contraseña...</i>
    fail_color = rgba(FF0000FF)
    fail_text = <i>Todo mal!!! <b>($ATTEMPTS)</b></i>
    hide_input = false
    position = 0, 50
    halign = center
    valign = bottom
}

# GREETING (Simplificado)
label {
    monitor =
    text = cmd[update:60000] echo "<b><big> $(date +"%H" | awk '{if ($1 < 12) print "Buenos Días"; else if ($1 < 18) print "Buenas Tardes"; else print "Buenas Noches"}'), $USER </big></b>"
    color = $text_color
    font_size = 20
    font_family = $fontFamily
    position = 0, 20
    halign = center
    valign = center
}

#ejemplo de uso de comando
label {
    monitor =
    text = cmd[update:1000] cat /tmp/texto.txt || echo 'Todo tranquilo aqui'
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = $fontFamily
    position = 0, 120
    halign = center
    valign = bottom

}

$musica= playerctl metadata -F --format "$(printf '{{title}}\n{{artist}}')"
# REPRODUCTOR MUSICAL (Solo si hay música)
label {
    monitor =
    text = cmd[update:100] $musica || echo "Nada por aqui" 
    color = rgba(255, 255, 255, 0.6)
    font_size = 20
    font_family = $fontFamily
    position = 0, -6%
    halign = center
    valign = center
}

$LAST_PLAYER="$(playerctl -l | tail -n1)"
# Next button
label {
    monitor =
    text = cmd[update:1000] { playerctl status -p $LAST_PLAYER | grep -q "Playing" ;} && echo "󰒭"
    onclick = playerctl -p $LAST_PLAYER next
    color = $text
    font_size = 20
    font_family = $fontFamily Bold
    position = 2%, -13 %
    halign = center
    valign = center
}

# Prev button
label {
    monitor =
    text = cmd[update:1000] { playerctl status -p $LAST_PLAYER | grep -q "Playing" ;} && echo "󰒮"
    onclick = playerctl -p $LAST_PLAYER previous && pkill -u $USER -SIGUSR2 hyprlock
    color = $text
    font_size = 20
    font_family = $fontFamily Bold
    position = -2%, -13 %
    halign = center
    valign = center
}

# Play/Pause button
label {
    monitor =
    text = cmd[update:1000] player=$LAST_PLAYER; [ -z "$player" ] && echo "" || (playerctl status -p "$player" 2>/dev/null | grep -q '^Playing$' && echo "⏸" || echo "▶")
    onclick = playerctl -p $LAST_PLAYER play-pause
    color = $text
    font_size = 20
    font_family = $fontFamily Bold
    position = 0, -13 %
    halign = center
    valign = center
}

# Current Keyboard Layout 
label {
    monitor =
    text = cmd[update:100] hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap'
    color = 
    font_size = 20
    font_family = $fontFamily
    position = -2%, 1%
    halign = right
    valign = bottom
}
