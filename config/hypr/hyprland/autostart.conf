###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
exec-once = swaync
exec-once = waybar > /dev/null 2>&1 &
exec-once = nm-applet
exec-once = awww-daemon
exec-once = ~/.config/scripts/ranwall.sh		#cambio de wallpaper cada 5mins
exec-once = gsd-xsettings
exec-once = hyprctl setcursor Aemeath_Full 24
#exec-once = kitty tty-clock -tcs -C 5 & kitty
exec-once = qs -c overview  
exec-once = poweralertd &
exec-once = /usr/bin/hyprland-per-window-layout
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
